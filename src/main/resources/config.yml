# ==============================================
#  FluxerSRV
# ==============================================

# Bot token from Fluxer
botToken: ""

# Channel IDs
channels:
  global: "000000000000000000"
  console: "000000000000000000"

# General
fluxer-global-only: false      # true = only chat starting with "!" goes to Fluxer
announce-advancements: true    # post advancements, goals and challenges

# Post chat through a webhook, so each message shows the player's name and avatar
webhooks:
  enabled: false
  url: ""
  name: " "
  username-format: "%player_name%"
  avatar-url: "https://heads.discordsrv.com/%player_name%/helm/256"
  content-format: "%message%"
  fallback-to-bot: true        # use the bot if the webhook fails

# Player count shown as the bot's status
status:
  enabled: true
  update-interval-seconds: 30
  format: "%online%/%max% players online"   # %online%, %max%
  presence: "online"       

# ==============================================
#  Minecraft -> Fluxer
# ==============================================

# Placeholders: %player_name%, %message%, %death_message%, %advancement%, %description%
formats:
  chat: "**%player_name%**: %message%"
  join: "**%player_name%** joined the server!"
  quit: "**%player_name%** left the server!"
  death: "☠️ %death_message%"
  advancement: "🏆 **%player_name%** has made the advancement **%advancement%**"
  goal: "🎯 **%player_name%** has reached the goal **%advancement%**"
  challenge: "🏅 **%player_name%** has completed the challenge **%advancement%**"
  serverStart: "# Server Started ✅"
  serverStop: "# Server Stopped ❌"

# Server start/stop, join, quit, death and advancement posts are sent as embeds (the formats above become the text).
embeds:
  # Master switch for all embeds. false = plain messages instead.
  enabled: true
  # Side-bar colors ("#RRGGBB")
  colors:
    join: "#57F287"
    quit: "#ED4245"
    advancement: "#FEE75C"
    goal: "#3498DB"
    challenge: "#9B59B6"
    death: "#2F3136"
    playerlist: "#5865F2"
    time: "#F1C40F"
    serverStart: "#57F287"
    serverStop: "#ED4245"

# ==============================================
#  Fluxer -> Minecraft
# ==============================================

# Colors: &a, &l, ... and hex as &#RRGGBB
# Placeholders: %username%, %display_name%, %nickname%, %message%
ingame:
  format: "[&bFluxer&r] <%username%> %message%"
  reply-format: "[&bFluxer&r] <%username%> &7(reply)&r %message%"
  reply-preview-length: 50
  allow-message-colors: true   # let Fluxer users use &-color codes

  # Links and attachments (false = show the full URL as plain text)
  clickable-links: true
  clickable-media: true
  # What clickable links and attachments display (%name% = file name, link text or short URL)
  media-placeholder: "&b&n%name%&r"
  file-placeholder: "&b&n%name%&r"
  link-placeholder: "&b&n%name%&r"
  link-max-length: 40          # longer plain links are cut with "..."

  mentions:
    user-format: "&b@%name%"
    role-format: "&b@%name%"
    channel-format: "&b#%name%"
    name-source: "nickname"    # username, display_name or nickname
                 # online, idle, dnd or invisible

# ==============================================
#  InteractiveChat
# ==============================================

interactivechat:
  enabled: true
  max-details-length: 1900     # max characters per details block

  # [item]  (%item% = name and amount, %player%)
  item:
    enabled: true
    keyword: "[item]"
    inline: "`[%item%]`"
    empty-inline: "`[Nothing]`"     # when the player holds nothing
    # Show as an embed instead of an inline tag + code block
    embed:
      enabled: true
      color: "#3498DB"
      title: "%player%'s Item"      # %player%, %item%

  # [inv]
  inventory:
    enabled: true
    keyword: "[inv]"
    inline: "`[%player%'s Inventory]`"
    embed:
      enabled: true
      color: "#5865F2"
      title: "%player%'s Inventory"

  # [ender]
  enderchest:
    enabled: true
    keyword: "[ender]"
    inline: "`[%player%'s Ender Chest]`"
    embed:
      enabled: true
      color: "#8E44AD"
      title: "%player%'s Ender Chest"

  # Contents of a shulker box shared with [item]
  shulker:
    embed:
      enabled: true
      color: "#CB4DCB"
      title: "%player%'s %item%"    # %item% = the box's name

  # Your own placeholders (any PlaceholderAPI or %player_*% value)
  custom:
    - keyword: "[pos]"
      replace: "`[%player_world%: %player_x% %player_y% %player_z%]`"

  # Text commands in the global channel:
  # <prefix>playerlist, <prefix>time, <prefix>item|inv|ender <player>
  commands:
    enabled: true
    prefix: "mc!"
    time-world: "world"             # world for <prefix>time (empty = main world)
